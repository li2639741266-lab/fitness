<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小花抗阻训练</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小花训练">
<meta name="theme-color" content="#F4F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15121A" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone app — home list of moves, full-screen workout runner, history by day */
:root{
  --bg:#F4F2F7; --surface:#FFFFFF; --surface-2:#ECE8F2; --ink:#221E2A; --muted:#6C6578;
  --line:#DCD6E4; --accent:#6A3FA3; --accent-ink:#FFFFFF; --petal:#EE5F82; --petal-2:#F7A3B7; --core:#F4B63E;
  --good:#2D8F65; --rest:#2B7FB0;
  --f-num:"Barlow Condensed","DIN Alternate","Helvetica Neue",Arial,sans-serif;
  --f-body:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15121A; --surface:#211D28; --surface-2:#2C2734; --ink:#F1EDF6; --muted:#A79FB3;
  --line:#3A3443; --accent:#B58BEC; --accent-ink:#1A1420; --petal:#FF7E9C; --petal-2:#FFB3C5; --core:#F6C25B;
  --good:#5CC898; --rest:#6DB8E3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15121A; --surface:#211D28; --surface-2:#2C2734; --ink:#F1EDF6; --muted:#A79FB3;
  --line:#3A3443; --accent:#B58BEC; --accent-ink:#1A1420; --petal:#FF7E9C; --petal-2:#FFB3C5; --core:#F6C25B;
  --good:#5CC898; --rest:#6DB8E3; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.view{display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.top h1{font-size:24px;font-weight:700;letter-spacing:.02em}
.top .date{color:var(--muted);font-size:13px}
.tabs{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.tabs button{padding:6px 14px;border-radius:999px;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* today strip */
.today{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;background:var(--surface);border-radius:var(--r);padding:16px}
.today .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em}
.today .val{font-size:34px;font-weight:700;line-height:1}
.today .val small{font-size:16px;color:var(--muted);font-weight:500;margin-left:3px}
.bouquet{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;min-height:26px;align-items:center}
.bouquet .empty{color:var(--muted);font-size:13px}
.sync{font-size:12px;color:var(--muted);text-align:right}

/* exercise list */
.list{display:flex;flex-direction:column;gap:10px}
.ex{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;width:100%;border:1px solid transparent;transition:transform .12s}
.ex:active{transform:scale(.985)}
.ex .ico{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent)}
.ex .ico svg{width:26px;height:26px}
.ex .name{font-size:17px;font-weight:600}
.ex .plan{font-size:13px;color:var(--muted)}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip.done{background:color-mix(in srgb,var(--petal) 16%,transparent);color:var(--petal)}
.chip.part{background:color-mix(in srgb,var(--rest) 15%,transparent);color:var(--rest)}
.section-h{font-size:13px;color:var(--muted);letter-spacing:.08em;margin-bottom:-6px}

/* settings */
details.panel{background:var(--surface);border-radius:var(--r);padding:4px 16px}
details.panel summary{padding:12px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.panel summary::after{content:"＋";color:var(--muted)}
details.panel[open] summary::after{content:"－"}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row label{font-size:14px}
select{font:inherit;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.switch{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{left:23px}
.help{font-size:13px;color:var(--muted);padding:4px 0 12px;line-height:1.7}
.help b{color:var(--ink)}
.btn-sm{padding:6px 12px;border-radius:10px;background:var(--surface-2);font-size:14px}

/* history */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--surface);border-radius:var(--r);padding:12px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:10px}
.wd.is-today{background:var(--surface-2)}
.wd .d{font-size:11px;color:var(--muted)}
.wd .n{font-size:20px;font-weight:700;line-height:1}
.wd .n.zero{color:var(--line)}
.day{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:8px}
.day-h h3{font-size:16px}
.day-h span{font-size:12px;color:var(--muted)}
.entry{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.entry .when{font-size:13px;color:var(--muted);line-height:1.35}
.entry .when b{display:block;color:var(--ink);font-family:var(--f-num);font-size:17px;font-weight:600}
.entry .what{min-width:0}
.entry .what .t{font-weight:600}
.entry .what .s{font-size:13px;color:var(--muted)}
.entry .del{font-size:12px;color:var(--muted);padding:2px 6px;border-radius:8px}
.entry .del.arm{background:var(--petal);color:#fff}
.empty-state{background:var(--surface);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}

/* runner */
.run{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.run-in{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:10px 32px;display:flex;flex-direction:column;gap:14px}
.run-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.run-top h2{text-align:center;font-size:19px}
.ghost{padding:8px 10px;border-radius:10px;color:var(--muted);font-size:15px}
.ghost.warn{color:var(--petal);font-weight:600}
.dots{display:flex;justify-content:center;gap:8px}
.dots i{width:30px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--petal)}
.dots i.cur{background:var(--accent)}
.dial{position:relative;width:min(78vw,300px);aspect-ratio:1;max-width:100%;margin:4px auto 0}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .track{fill:none;stroke:var(--surface-2);stroke-width:14}
.dial .arc{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .12s linear,stroke .3s}
.dial.resting .arc{stroke:var(--rest)}
.dial.final .arc{stroke:var(--petal)}
.dial-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.phase{font-size:14px;letter-spacing:.12em;color:var(--muted)}
.big{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:clamp(72px,24vw,112px);font-weight:700;line-height:.9}
.unit{font-size:14px;color:var(--muted)}
.side{font-size:20px;font-weight:700;color:var(--accent);min-height:28px}
.elapsed{text-align:center;color:var(--muted);font-size:14px;min-height:21px}
.cheer{text-align:center;font-weight:700;color:var(--petal);font-size:18px;min-height:27px}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{min-width:130px;padding:14px 20px;border-radius:14px;font-size:17px;font-weight:600;background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big-start{min-width:220px;padding:18px 24px;font-size:19px}
.tips{background:var(--surface);border-radius:var(--r);padding:14px 16px}
.tips h3{font-size:14px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px;font-weight:600}
.tips ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.tips li{color:var(--muted);transition:color .2s}
.tips li.now{color:var(--ink);font-weight:600}
.tips li.now::marker{color:var(--accent)}

/* flower reward */
.reward{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:16px}
.reward-card{background:var(--surface);border-radius:24px;padding:26px 22px;text-align:center;max-width:320px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.reward-card .fl{width:140px;height:140px;animation:bloom .9s cubic-bezier(.2,1.4,.4,1) both}
.reward-card h2{font-size:22px}
.reward-card p{margin:0;color:var(--muted)}
@keyframes bloom{0%{transform:scale(.1) rotate(-90deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){.reward-card .fl{animation:none}.ex{transition:none}}
</style>

</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div>
      <h1>小花抗阻训练</h1>
      <div class="date" id="dateLine"></div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabTrain" aria-selected="true">训练</button>
      <button role="tab" id="tabLog" aria-selected="false">记录</button>
    </div>
  </header>

  <main id="viewTrain" class="view">
    <section class="today" aria-label="今日概况">
      <div>
        <div class="lbl">今天的小花</div>
        <div class="val num" id="todayFlowers">0<small>朵</small></div>
      </div>
      <div>
        <div class="lbl">今天练了</div>
        <div class="val num" id="todayMin">0<small>分钟</small></div>
      </div>
      <div class="bouquet" id="bouquet"></div>
    </section>

    <div class="section-h">今天想练哪个？练完一个就有一朵花</div>
    <div class="list" id="exList"></div>

    <details class="panel" id="setPanel">
      <summary>设置</summary>
      <div class="row"><label for="swVoice">语音播报</label><button class="switch" id="swVoice" role="switch" aria-checked="true" aria-label="语音播报"></button></div>
      <div class="row"><label for="selEvery">倒计时播报</label>
        <select id="selEvery"><option value="1">每秒都报</option><option value="5">每 5 秒</option><option value="10">每 10 秒</option></select></div>
      <div class="row"><label for="selRest">组间休息</label>
        <select id="selRest"><option value="20">20 秒</option><option value="30">30 秒</option><option value="45">45 秒</option><option value="60">60 秒</option><option value="90">90 秒</option></select></div>
      <div class="row"><label for="selPace">数次数的速度</label>
        <select id="selPace"><option value="1.3">慢一点</option><option value="1">标准</option><option value="0.8">快一点</option></select></div>
      <div class="row"><label>试听声音</label><button class="btn-sm" id="btnTest">播放一句</button></div>
      <div class="help"><b>添加到 iPhone 主屏幕：</b>用 Safari 打开本页，点底部的「分享」按钮，选「添加到主屏幕」。<br><b>没有声音？</b>检查手机侧边静音开关，并把媒体音量调大。</div>
    </details>
  </main>

  <main id="viewLog" class="view" hidden>
    <div class="week" id="week"></div>
    <div id="days" style="display:flex;flex-direction:column;gap:12px"></div>
  </main>
</div>

<section class="run" id="run" hidden aria-label="训练中">
  <div class="run-in">
    <div class="run-top">
      <button class="ghost" id="runBack">‹ 返回</button>
      <h2 id="runTitle"></h2>
      <button class="ghost" id="runMute">声音 开</button>
    </div>
    <div class="dots" id="dots"></div>
    <div class="dial" id="dial">
      <svg viewBox="0 0 220 220" aria-hidden="true"><circle class="track" cx="110" cy="110" r="96"/><circle class="arc" id="arc" cx="110" cy="110" r="96" stroke-dasharray="603.19" stroke-dashoffset="603.19"/></svg>
      <div class="dial-c">
        <div class="phase" id="phase">准备</div>
        <div class="big" id="big">40</div>
        <div class="unit" id="unit">秒</div>
        <div class="side" id="side"></div>
      </div>
    </div>
    <div class="cheer" id="cheer" aria-live="polite"></div>
    <div class="elapsed" id="elapsed"></div>
    <div class="controls" id="controls"></div>
    <div class="tips"><h3>姿势要点</h3><ol id="tips"></ol></div>
  </div>
</section>

<div class="reward" id="reward" hidden>
  <div class="reward-card">
    <svg class="fl" id="rewardFlower" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <h2 id="rewardTitle">送你一朵小花</h2>
    <p id="rewardText"></p>
    <button class="btn primary" id="rewardOk">收下啦</button>
  </div>
</div>

<script>
/* ---------- exercises ---------- */
const EX = [
  {id:'wallsit', name:'靠墙静蹲', type:'time', target:40, sets:3,
   tips:['背部和臀部紧贴墙面','大腿接近与地面平行，膝盖约 90 度','膝盖对准脚尖方向，不要内扣','双脚与肩同宽，重心在脚跟','保持均匀呼吸，不要憋气'],
   say:['背贴墙，膝盖九十度','膝盖对准脚尖，别内扣','重心放在脚跟，保持呼吸']},
  {id:'lunge', name:'交替弓步蹲', type:'reps', target:12, sets:3, side:'alt', pace:3,
   tips:['上身挺直，收紧核心','前腿膝盖对准脚尖，不要超出太多','后腿膝盖向下沉，接近地面','前脚跟发力站起来','步子迈大一点，两膝都约 90 度'],
   say:['上身挺直，左右交替','前膝对准脚尖，后膝下沉','脚跟发力站起来']},
  {id:'plank', name:'平板支撑', type:'time', target:40, sets:3,
   tips:['手肘在肩膀正下方','头、背、臀、腿成一条直线','不塌腰，也不撅屁股','收紧腹部和臀部','保持呼吸，眼睛看地面'],
   say:['手肘在肩膀下方，身体一条直线','不塌腰，不撅屁股','收紧腹部，保持呼吸']},
  {id:'bridge', name:'仰卧臀翘', type:'reps', target:20, sets:3, pace:2.5,
   tips:['双脚与髋同宽，脚跟靠近臀部','用臀部发力把髋部抬起来','顶端夹紧臀部，停一下','肩、髋、膝成一条直线，不要过度挺腰','慢慢放下，控制速度'],
   say:['脚跟踩地，臀部发力','顶端夹紧臀部','慢慢放下，别塌腰']},
  {id:'kick', name:'站姿后踢腿', type:'reps', target:15, sets:3, side:'each', pace:2,
   tips:['双手扶墙或椅背保持平衡','上身稳定，不要前后晃','腿向后上方踢，用臀部发力','不要塌腰借力','慢慢放回，控制回落'],
   say:['扶稳，上身不动','臀部发力往后踢','不要塌腰，慢慢放回']},
  {id:'pushup', name:'跪姿俯卧撑', type:'reps', target:12, sets:3, pace:3,
   tips:['双膝着地，膝盖到头成一条直线','双手略宽于肩','下放时手肘约 45 度，贴近身体','胸部接近地面再推起','收紧腹部，不要塌腰'],
   say:['膝盖到头一条直线','手肘贴近身体，慢慢下放','收紧腹部，别塌腰']},
  {id:'hang', name:'吊单杠', type:'hang', sets:0,
   tips:['双手略宽于肩，正握单杠','肩膀下沉，不要耸肩','身体放松下垂，避免晃动','手滑或发酸就下来，量力而行','落地时屈膝缓冲'],
   say:['肩膀下沉，身体放松','别耸肩，保持呼吸']}
];
const ICONS = {
  time:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg>',
  reps:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h3M4 12h5M4 17h3M12 6l4 6-4 6M17 6l4 6-4 6"/></svg>',
  hang:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4h18M8 4v5M16 4v5"/><circle cx="12" cy="11.5" r="2"/><path d="M8 9l4 4 4-4M12 13.5v4.5M10 22l2-4 2 4"/></svg>'
};
const planText = e => e.type==='time' ? `${e.target} 秒 × ${e.sets} 组`
  : e.type==='hang' ? '自由计时，只记时长'
  : e.side==='each' ? `左右腿各 ${e.target} 次 × ${e.sets} 组`
  : e.side==='alt' ? `左右交替 ${e.target} 次 × ${e.sets} 组` : `${e.target} 次 × ${e.sets} 组`;
const ENC5 = ['最后五秒，坚持住','最后五秒，你可以的','最后五秒，加油','马上就好，坚持住'];
const ENC_REP = ['最后五个，加油','还剩五个，坚持住','最后五个，你超棒'];
const DONE = ['完成！太棒了','漂亮，完成了','做得好！'];
const ENC_HANG = ['太厉害了','继续保持','你真棒'];
const pick = a => a[Math.floor(Math.random()*a.length)];

/* ---------- storage ---------- */
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let settings = Object.assign({voice:true,every:5,rest:30,pace:1}, lsGet('xh.settings',{}));
let logs = lsGet('xh.logs',{}); // { 'YYYY-MM-DD': [entry] }
const saveSettings = () => lsSet('xh.settings',settings);

const pad = n => String(n).padStart(2,'0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm = ts => {const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
function period(ts){const h=new Date(ts).getHours();return h<5?'深夜':h<11?'早上':h<13?'中午':h<18?'下午':h<23?'晚上':'深夜'}

/* records live in this phone's browser */
let syncText='记录保存在这台手机上';
function setSync(t){syncText=t; const el=document.getElementById('syncLine'); if(el) el.textContent=t}
function writeDay(day){ lsSet('xh.logs',logs); }

function upsertEntry(entry){
  const day = dayKey(new Date(entry.start));
  const arr = logs[day] || (logs[day]=[]);
  const i = arr.findIndex(e=>e.key===entry.key);
  if(i>=0) arr[i]=entry; else arr.push(entry);
  arr.sort((a,b)=>a.start-b.start);
  writeDay(day);
}
function deleteEntry(day,key){
  logs[day] = (logs[day]||[]).filter(e=>e.key!==key);
  if(!logs[day].length) delete logs[day];
  writeDay(day); renderAll();
}

/* ---------- sound ---------- */
let voice=null, actx=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null}catch(e){}}
if('speechSynthesis' in window){pickVoice(); try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function say(text){
  if(!settings.voice || !('speechSynthesis' in window) || !text) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='zh-CN'; if(voice)u.voice=voice; u.rate=1.1; speechSynthesis.speak(u);}catch(e){}
}
function beep(freq=880,ms=120){
  if(!settings.voice) return;
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
    const t=actx.currentTime; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.25,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+ms/1000);
    o.start(t); o.stop(t+ms/1000+.02);}catch(e){}
}
function unlockAudio(){ try{actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume&&actx.resume()}catch(e){} }
let wakeLock=null;
async function keepAwake(on){ try{ if(on && navigator.wakeLock && !wakeLock){wakeLock=await navigator.wakeLock.request('screen')} else if(!on && wakeLock){await wakeLock.release(); wakeLock=null} }catch(e){wakeLock=null} }

/* ---------- flower ---------- */
function flowerSVG(size, seed=0){
  const rot = (seed*37)%72;
  let p='';
  for(let i=0;i<5;i++){const a=(i*72+rot)*Math.PI/180; const x=50+Math.cos(a)*22, y=50+Math.sin(a)*22;
    p+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="17" ry="13" transform="rotate(${i*72+rot} ${x.toFixed(1)} ${y.toFixed(1)})" fill="var(--petal)"/>`;
    p+=`<ellipse cx="${(50+Math.cos(a)*26).toFixed(1)}" cy="${(50+Math.sin(a)*26).toFixed(1)}" rx="7" ry="4.5" transform="rotate(${i*72+rot} ${(50+Math.cos(a)*26).toFixed(1)} ${(50+Math.sin(a)*26).toFixed(1)})" fill="var(--petal-2)"/>`}
  const inner = p+`<circle cx="50" cy="50" r="12" fill="var(--core)"/><circle cx="46" cy="46" r="3" fill="#fff" opacity=".55"/>`;
  return size ? `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">${inner}</svg>` : inner;
}

/* ---------- home ---------- */
const $ = id => document.getElementById(id);
function todayEntries(){ return logs[dayKey(new Date())]||[] }
function renderHome(){
  const now=new Date();
  $('dateLine').textContent = `${now.getMonth()+1}月${now.getDate()}日 ${WEEK[now.getDay()]}`;
  const te = todayEntries();
  const flowers = te.filter(e=>e.complete).length;
  const mins = Math.round(te.reduce((s,e)=>s+(e.end-e.start),0)/60000);
  $('todayFlowers').innerHTML = `${flowers}<small>朵</small>`;
  $('todayMin').innerHTML = `${mins}<small>分钟</small>`;
  $('bouquet').innerHTML = flowers ? te.filter(e=>e.complete).map((e,i)=>flowerSVG(26,i)).join('')
    : '<span class="empty">还没有小花，从任意一个动作开始吧</span>';
  $('bouquet').insertAdjacentHTML('beforeend',`<span class="sync" id="syncLine" style="margin-left:auto">${syncText}</span>`);
  $('exList').innerHTML = EX.map(e=>{
    const mine = te.filter(x=>x.id===e.id);
    let chip='<span class="chip">今天未练</span>';
    if(e.type==='hang'){ const s=mine.reduce((a,x)=>a+x.sets.reduce((p,q)=>p+q,0),0); if(s) chip=`<span class="chip ${mine.some(x=>x.complete)?'done':'part'}">今天 ${fmtSec(s)}</span>`; }
    else if(mine.length){ const c=mine.filter(x=>x.complete).length; const best=Math.max(...mine.map(x=>x.sets.length));
      chip = c ? `<span class="chip done">${flowerSVG(14)} 完成${c>1?' ×'+c:''}</span>` : `<span class="chip part">做了 ${best}/${e.sets} 组</span>`; }
    return `<button class="ex" data-id="${e.id}"><span class="ico">${ICONS[e.type]}</span><span><span class="name">${e.name}</span><br><span class="plan">${planText(e)}</span></span>${chip}</button>`;
  }).join('');
}
const fmtSec = s => s>=60 ? `${Math.floor(s/60)}分${pad(s%60)}秒` : `${s}秒`;

/* ---------- history ---------- */
function renderLog(){
  const today=new Date(); let w='';
  for(let i=6;i>=0;i--){const d=new Date(today); d.setDate(d.getDate()-i); const n=(logs[dayKey(d)]||[]).filter(e=>e.complete).length;
    w+=`<div class="wd ${i===0?'is-today':''}"><span class="d">${i===0?'今天':WEEK[d.getDay()]}</span>${n?flowerSVG(22,i):'<svg width="22" height="22"></svg>'}<span class="n num ${n?'':'zero'}">${n}</span></div>`;}
  $('week').innerHTML=w;
  const days = Object.keys(logs).filter(k=>logs[k].length).sort().reverse();
  if(!days.length){ $('days').innerHTML='<div class="empty-state">还没有训练记录。<br>练完的每个动作都会按时间记在这里。</div>'; return; }
  $('days').innerHTML = days.map(day=>{
    const arr=logs[day]; const [y,m,d]=day.split('-').map(Number); const dt=new Date(y,m-1,d);
    const fl=arr.filter(e=>e.complete).length; const mins=Math.round(arr.reduce((s,e)=>s+(e.end-e.start),0)/60000);
    return `<div class="day"><div class="day-h"><h3>${m}月${d}日 ${WEEK[dt.getDay()]}</h3><span>${fl} 朵小花 · 约 ${mins} 分钟</span></div>`+
      arr.map(e=>{
        const ex=EX.find(x=>x.id===e.id)||{name:e.name,sets:0};
        const detail = e.unit==='秒' ? e.sets.map(fmtSec).join(' · ') : e.sets.map(v=>v+'次').join(' · ');
        const status = ex.type==='hang' ? `共 ${fmtSec(e.sets.reduce((a,b)=>a+b,0))}` : `${e.sets.length}/${ex.sets} 组`;
        return `<div class="entry"><div class="when">${period(e.start)}<b>${hm(e.start)}</b>到 ${hm(e.end)}</div>
          <div class="what"><div class="t">${ex.name} ${e.complete?flowerSVG(16):''}</div><div class="s">${status}（${detail}）</div></div>
          <button class="del" data-day="${day}" data-key="${e.key}">删除</button></div>`;}).join('')+'</div>';
  }).join('');
}
function renderAll(){ renderHome(); renderLog(); }

/* ---------- runner ---------- */
let R=null;
const CIRC=603.19;
function openRun(id){
  const ex=EX.find(e=>e.id===id);
  R={ex, phase:'idle', setsDone:[], tipIdx:0, events:[], idx:0, t0:0, dur:0, paused:false, rep:0, sideTxt:'', entry:null, flowered:false, backArm:0};
  $('runTitle').textContent=ex.name;
  $('tips').innerHTML=ex.tips.map(t=>`<li>${t}</li>`).join('');
  $('run').hidden=false; document.body.style.overflow='hidden';
  updateMute(); drawStatic(); renderControls();
}
function curTip(){ return R.ex.say[R.tipIdx % R.ex.say.length] }
function highlightTip(){
  const n=R.ex.tips.length; const i=(R.tipIdx*2)%n;
  [...$('tips').children].forEach((li,k)=>li.classList.toggle('now',k===i||k===(i+1)%n));
}
function startPhase(phase,dur,events){ R.phase=phase; R.dur=dur; R.events=events; R.idx=0; R.t0=performance.now(); R.paused=false; R.lastS=-1; $('cheer').textContent=''; renderControls(); }

function beginExercise(){
  unlockAudio(); keepAwake(true);
  if(!R.entry) R.entry={key:Date.now()+'-'+R.ex.id, id:R.ex.id, name:R.ex.name, start:Date.now(), end:Date.now(), sets:[], unit:R.ex.type==='reps'?'次':'秒', complete:false};
  highlightTip();
  const n=R.setsDone.length+1;
  const label = R.ex.type==='hang' ? `${R.ex.name}，${curTip()}` : `第${n}组，${R.ex.name}。${curTip()}`;
  startPhase('prep',6,[{t:0,say:label},{t:3,say:'三',beep:1},{t:4,say:'二',beep:1},{t:5,say:'一',beep:1}]);
}
function beginWork(){
  const ex=R.ex;
  if(ex.type==='time'){
    const T=ex.target, ev=[{t:0,say:'开始',beep:2}];
    for(let s=T-1;s>=1;s--){ const t=T-s;
      if(s===5) ev.push({t,say:pick(ENC5),beep:1,cheer:'最后 5 秒，坚持住！'});
      else if(s<=3) ev.push({t,say:['','一','二','三'][s],beep:1});
      else if(s===4) ev.push({t,beep:1});
      else if(s%settings.every===0) ev.push({t,say:`还剩${s}秒`});
      if(s===Math.floor(T/2) && s%settings.every!==0 && s>5) ev.push({t,say:'坚持住，已经一半了'});
    }
    ev.sort((a,b)=>a.t-b.t);
    startPhase('work',T,ev);
  } else if(ex.type==='reps'){
    const p=ex.pace*settings.pace, ev=[]; let t=0;
    const blocks = ex.side==='each' ? [['左腿',ex.target],['右腿',ex.target]] : [[ex.side==='alt'?'alt':'',ex.target]];
    blocks.forEach(([side,n],bi)=>{
      if(side==='左腿'||side==='右腿'){ ev.push({t,say:bi?'换右腿':'先练左腿',side,rep:0}); t+=bi?3:1.8; }
      else ev.push({t,say:side==='alt'?'开始，左右交替':'开始',beep:2,rep:0});
      if(side!=='左腿'&&side!=='右腿') t+=1.2;
      for(let k=1;k<=n;k++){ t+=p;
        const sideNow = side==='alt' ? (k%2?'左腿':'右腿') : side;
        let s = side==='alt' ? `${k%2?'左':'右'}${k}` : String(k);
        let cheer='';
        const last = bi===blocks.length-1;
        if(last && n-k===5){ s+=`，${pick(ENC_REP)}`; cheer='最后 5 个，加油！'; }
        if(last && k===n) s=`${k}，${pick(DONE)}`;
        ev.push({t,say:s,rep:k,side:sideNow,cheer, beep: last&&n-k<5?1:0});
      }
    });
    startPhase('work',t+1.2,ev);
  } else {
    startPhase('work',Infinity,[{t:0,say:'开始计时',beep:2}]);
  }
}
function beginRest(){
  const n=R.setsDone.length+1, T=settings.rest; R.tipIdx++; highlightTip();
  const ev=[{t:0,say:`完成第${n-1}组，休息${T}秒`}];
  if(T>=20) ev.push({t:T-10,say:'还有十秒'});
  ev.push({t:T-6.5,say:`准备第${n}组，${curTip()}`});
  ev.push({t:T-3,say:'三',beep:1},{t:T-2,say:'二',beep:1},{t:T-1,say:'一',beep:1});
  startPhase('rest',T,ev);
}
function finishSet(value){
  R.setsDone.push(value);
  R.entry.sets=[...R.setsDone]; R.entry.end=Date.now();
  const ex=R.ex;
  if(ex.type==='hang'){
    const total=R.setsDone.reduce((a,b)=>a+b,0);
    if(total>=10) R.entry.complete=true;
    upsertEntry({...R.entry}); renderAll();
    R.phase='hangIdle'; R.rep=value; renderControls(); drawStatic();
    if(R.entry.complete && !R.flowered){ R.flowered=true; say(`坚持了${value}秒，太棒了，送你一朵小花`); showReward(); }
    else say(`坚持了${value}秒`);
    return;
  }
  if(R.setsDone.length>=ex.sets){
    R.entry.complete=true; upsertEntry({...R.entry}); renderAll();
    R.phase='done'; renderControls(); drawStatic(); keepAwake(false);
    say(`${ex.name}全部完成，送你一朵小花`);
    showReward();
  } else {
    upsertEntry({...R.entry}); renderAll();
    beginRest();
  }
}
function phaseEnd(el){
  if(R.phase==='prep'||R.phase==='rest') beginWork();
  else if(R.phase==='work'){
    if(R.ex.type==='time') finishSet(R.ex.target);
    else if(R.ex.type==='reps') finishSet(R.ex.target);
  }
}
function fire(e){
  if(e.rep!==undefined) R.rep=e.rep;
  if(e.side!==undefined) R.sideTxt=e.side;
  if(e.cheer) $('cheer').textContent=e.cheer;
  if(e.say) say(e.say);
  if(e.beep) beep(e.beep===2?1046:880, e.beep===2?220:110);
}
function elapsed(){ return R.paused ? (R.pauseAt-R.t0)/1000 : (performance.now()-R.t0)/1000 }
function tick(){
  if(!R || R.paused || !['prep','work','rest'].includes(R.phase)) return;
  const el=elapsed();
  while(R.idx<R.events.length && R.events[R.idx].t<=el){ fire(R.events[R.idx]); R.idx++; }
  if(R.ex.type==='hang' && R.phase==='work'){
    const s=Math.floor(el);
    if(s>0 && s!==R.lastS){ R.lastS=s;
      if(s%30===0){ say(`${s}秒，${pick(ENC_HANG)}`); $('cheer').textContent=`${s} 秒！${pick(ENC_HANG)}`; }
      else if(s%10===0) say(`${s}秒`);
      else if(settings.every===1) say(String(s));
      else if(settings.every===5 && s%5===0) say(`${s}秒`);
    }
  }
  if(el>=R.dur) { phaseEnd(el); }
  draw(Math.min(elapsed(),R.dur));
}
setInterval(tick,100);

function setDial(frac,cls){ $('arc').style.strokeDashoffset = String(CIRC*(1-Math.max(0,Math.min(1,frac)))); $('dial').className='dial '+(cls||''); }
function drawDots(){
  const ex=R.ex;
  if(ex.type==='hang'){ $('dots').innerHTML = R.setsDone.map(()=>'<i class="on"></i>').join(''); return; }
  $('dots').innerHTML = Array.from({length:ex.sets},(_,i)=>`<i class="${i<R.setsDone.length?'on':(i===R.setsDone.length&&R.phase!=='done'?'cur':'')}"></i>`).join('');
}
function draw(el){
  const ex=R.ex; drawDots();
  if(R.phase==='prep'){ $('phase').textContent='准备'; $('big').textContent=Math.max(1,Math.ceil(R.dur-el)); $('unit').textContent='秒后开始'; $('side').textContent=''; setDial(el/R.dur); $('elapsed').textContent=''; return; }
  if(R.phase==='rest'){ $('phase').textContent='休息'; $('big').textContent=Math.max(0,Math.ceil(R.dur-el)); $('unit').textContent=`秒后开始第 ${R.setsDone.length+1} 组`; $('side').textContent=''; setDial(1-el/R.dur,'resting'); $('elapsed').textContent='喝口水，调整呼吸'; return; }
  if(R.phase==='work'){
    $('phase').textContent = ex.type==='hang' ? '计时中' : `第 ${R.setsDone.length+1} 组`;
    if(ex.type==='time'){ const left=Math.max(0,Math.ceil(R.dur-el)); $('big').textContent=left; $('unit').textContent=`秒 · 目标 ${ex.target} 秒`; $('side').textContent=''; setDial(el/R.dur, left<=5?'final':''); $('elapsed').textContent=`已坚持 ${Math.floor(el)} 秒`; }
    else if(ex.type==='reps'){ const total=ex.side==='each'?ex.target*2:ex.target; const done = ex.side==='each' && R.sideTxt==='右腿' ? ex.target+R.rep : R.rep;
      $('big').textContent=R.rep; $('unit').textContent=`/ ${ex.target} 次`; $('side').textContent=R.sideTxt||''; setDial(done/total, total-done<=5?'final':''); $('elapsed').textContent=`本组用时 ${Math.floor(el)} 秒`; }
    else { const s=Math.floor(el); $('big').textContent = s>=60?`${Math.floor(s/60)}:${pad(s%60)}`:s; $('unit').textContent= s>=60?'分:秒':'秒'; $('side').textContent=''; setDial((el%60)/60); const best=Math.max(0,...R.setsDone); $('elapsed').textContent= best?`本次最长 ${fmtSec(best)}`:''; }
  }
}
function drawStatic(){
  const ex=R.ex; drawDots(); $('elapsed').textContent='';
  if(R.phase==='idle'){
    $('phase').textContent= ex.type==='hang'?'吊单杠':'共 '+ex.sets+' 组';
    if(ex.type==='time'){$('big').textContent=ex.target;$('unit').textContent='秒 / 组';}
    else if(ex.type==='reps'){$('big').textContent=ex.target;$('unit').textContent=ex.side==='each'?'次 / 每条腿':ex.side==='alt'?'次 / 左右交替':'次 / 组';}
    else {$('big').textContent='0';$('unit').textContent='秒';}
    $('side').textContent=''; setDial(0); $('cheer').textContent='';
  } else if(R.phase==='done'){
    $('phase').textContent='全部完成'; $('big').textContent=`${ex.sets}/${ex.sets}`; $('unit').textContent='组'; $('side').textContent=''; setDial(1,'final'); $('cheer').textContent='太棒了！';
  } else if(R.phase==='hangIdle'){
    $('phase').textContent=`已挂 ${R.setsDone.length} 次`; $('big').textContent=R.rep; $('unit').textContent='秒（刚才这次）'; setDial(1); $('elapsed').textContent=`合计 ${fmtSec(R.setsDone.reduce((a,b)=>a+b,0))}`;
  }
}
function renderControls(){
  const c=$('controls'), ex=R.ex; let h='';
  const pauseBtn = `<button class="btn" data-act="pause">${R.paused?'继续':'暂停'}</button>`;
  if(R.phase==='idle') h=`<button class="btn primary big-start" data-act="start">${ex.type==='hang'?'开始计时':'开始训练'}</button>`;
  else if(R.phase==='prep') h=pauseBtn+`<button class="btn" data-act="skip">直接开始</button>`;
  else if(R.phase==='rest') h=pauseBtn+`<button class="btn" data-act="skip">跳过休息</button>`;
  else if(R.phase==='work'){
    if(ex.type==='time') h=pauseBtn+`<button class="btn" data-act="endset">提前结束本组</button>`;
    else if(ex.type==='reps') h=pauseBtn+`<button class="btn primary" data-act="endset">完成本组</button>`;
    else h=`<button class="btn primary big-start" data-act="endset">下杠，停止计时</button>`;
  }
  else if(R.phase==='hangIdle') h=`<button class="btn primary" data-act="start">再挂一次</button><button class="btn" data-act="close">结束</button>`;
  else if(R.phase==='done') h=`<button class="btn primary big-start" data-act="close">回到首页</button>`;
  c.innerHTML=h;
}
function closeRun(){
  if(R && R.entry && R.setsDone.length){ R.entry.end = R.entry.end || Date.now(); upsertEntry({...R.entry}); }
  try{speechSynthesis.cancel()}catch(e){}
  keepAwake(false);
  R=null; $('run').hidden=true; document.body.style.overflow=''; renderAll();
}
$('controls').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!R) return; const act=b.dataset.act;
  if(act==='start') beginExercise();
  else if(act==='pause'){
    if(R.paused){ R.t0 += performance.now()-R.pauseAt; R.paused=false; say('继续'); }
    else { R.paused=true; R.pauseAt=performance.now(); try{speechSynthesis.cancel()}catch(e){} $('cheer').textContent='已暂停'; }
    renderControls();
  }
  else if(act==='skip'){ try{speechSynthesis.cancel()}catch(e){} beginWork(); }
  else if(act==='endset'){
    const el=Math.floor(elapsed());
    if(R.ex.type==='hang'){ if(el<1){ return; } finishSet(el); }
    else if(R.ex.type==='time'){ if(el<1) return; finishSet(Math.min(el,R.ex.target)); }
    else { const v = R.ex.side==='each' && R.sideTxt==='左腿' ? R.rep : R.rep; if(v<1){ toast('还没数到 1 次哦'); return; } finishSet(v); }
  }
  else if(act==='close') closeRun();
});
$('runBack').addEventListener('click',()=>{
  if(R && ['prep','work','rest'].includes(R.phase) && Date.now()-R.backArm>3000){
    R.backArm=Date.now(); $('runBack').classList.add('warn'); $('runBack').textContent='再点退出';
    toast(R.setsDone.length?`已完成的 ${R.setsDone.length} 组会保存`:'这一组还没完成，不会记录');
    setTimeout(()=>{ $('runBack').classList.remove('warn'); $('runBack').textContent='‹ 返回'; },3000);
    return;
  }
  $('runBack').classList.remove('warn'); $('runBack').textContent='‹ 返回';
  closeRun();
});
function updateMute(){ $('runMute').textContent = settings.voice?'声音 开':'声音 关'; $('swVoice').setAttribute('aria-checked',settings.voice) }
$('runMute').addEventListener('click',()=>{ settings.voice=!settings.voice; saveSettings(); if(!settings.voice) try{speechSynthesis.cancel()}catch(e){} updateMute(); });

/* reward */
function showReward(){
  const n=todayEntries().filter(e=>e.complete).length;
  $('rewardFlower').innerHTML=flowerSVG(0,n);
  $('rewardTitle').textContent = n>1?`今天第 ${n} 朵小花`:'送你一朵小花';
  $('rewardText').textContent = R.ex.type==='hang' ? '吊单杠也算数，手臂辛苦啦' : `${R.ex.name} ${R.ex.sets} 组全部完成`;
  $('reward').hidden=false;
}
$('rewardOk').addEventListener('click',()=>{ $('reward').hidden=true; });

/* toast */
let toastT=null;
function toast(t){ let el=document.querySelector('.toast'); if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el)} el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2600); }

/* home events */
$('exList').addEventListener('click',e=>{ const b=e.target.closest('.ex'); if(b) openRun(b.dataset.id); });
$('tabTrain').addEventListener('click',()=>{ $('tabTrain').setAttribute('aria-selected','true'); $('tabLog').setAttribute('aria-selected','false'); $('viewTrain').hidden=false; $('viewLog').hidden=true; });
$('tabLog').addEventListener('click',()=>{ $('tabLog').setAttribute('aria-selected','true'); $('tabTrain').setAttribute('aria-selected','false'); $('viewTrain').hidden=true; $('viewLog').hidden=false; renderLog(); });
$('days').addEventListener('click',e=>{
  const b=e.target.closest('.del'); if(!b) return;
  if(b.classList.contains('arm')){ deleteEntry(b.dataset.day,b.dataset.key); return; }
  b.classList.add('arm'); b.textContent='确认删除'; setTimeout(()=>{ if(b.isConnected){b.classList.remove('arm'); b.textContent='删除';} },3000);
});
$('swVoice').addEventListener('click',()=>{ settings.voice=!settings.voice; saveSettings(); updateMute(); });
$('selEvery').value=String(settings.every); $('selRest').value=String(settings.rest); $('selPace').value=String(settings.pace);
$('selEvery').addEventListener('change',e=>{settings.every=+e.target.value;saveSettings()});
$('selRest').addEventListener('change',e=>{settings.rest=+e.target.value;saveSettings()});
$('selPace').addEventListener('change',e=>{settings.pace=+e.target.value;saveSettings()});
$('btnTest').addEventListener('click',()=>{ unlockAudio(); const was=settings.voice; settings.voice=true; say('最后五秒，坚持住，你超棒的'); beep(); settings.voice=was; });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && R && ['prep','work','rest'].includes(R.phase)){ wakeLock=null; keepAwake(true); } });

updateMute(); renderAll();
</script>

</body>
</html>
